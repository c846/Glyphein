<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>The Pillprocessor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toolbar">
      <select id="font" title="Font"></select>
      <input id="size" type="number" min="1" max="400" step="any" list="sizes" title="Font size" />
      <datalist id="sizes">
        <option value="8"></option>
        <option value="8.5"></option>
        <option value="9"></option>
        <option value="10"></option>
        <option value="11"></option>
        <option value="12"></option>
        <option value="14"></option>
        <option value="16"></option>
        <option value="18"></option>
        <option value="20"></option>
        <option value="24"></option>
        <option value="28"></option>
        <option value="36"></option>
        <option value="48"></option>
        <option value="72"></option>
      </datalist>
      <button id="bold" type="button" title="Bold (Ctrl+B)"><b>B</b></button>
      <button id="italic" type="button" title="Italic (Ctrl+I)"><i>I</i></button>
      <button id="underline" type="button" title="Underline (Ctrl+U)"><u>U</u></button>
      <button id="image" type="button" title="Insert image">Image</button>
      <input id="image-file" type="file" accept="image/*" multiple hidden />
      <button id="table" type="button" title="Create table">Table</button>
      <button id="split" type="button" title="Split the selected cell or cells">Split</button>
      <button id="add-row" type="button" title="Add a row below">Add Row</button>
      <button id="add-column" type="button" title="Add a column to the right">Add Col</button>
      <button id="delete-table" type="button" title="Delete this table">Del Table</button>
    </div>
    <div id="desk">
      <div id="document"></div>
    </div>
    <div id="bullet-menu" hidden>
      <div id="bullet-symbols"></div>
      <form id="bullet-custom-form">
        <input id="bullet-custom" placeholder="Other symbol (Win + .)" title="Type or paste any symbol, then press Enter" />
        <button>Use</button>
      </form>
      <button id="bullet-default" type="button">Default</button>
    </div>
    <dialog id="dimensions">
      <form method="dialog">
        <p id="dimensions-title"></p>
        <p><label>Rows <input id="dimension-rows" type="number" min="1" step="1" required /></label></p>
        <p><label>Columns <input id="dimension-cols" type="number" min="1" step="1" required /></label></p>
        <button value="ok">OK</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </form>
    </dialog>
    <dialog id="message">
      <form method="dialog">
        <p id="message-text"></p>
        <button>OK</button>
      </form>
    </dialog>
    <script src="build/renderer.js"></script>
  </body>
</html>
